[package]
name = "bara-pet"
version = "0.1.7"
description = "Bara Pet desktop host"
authors = ["Bara contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
