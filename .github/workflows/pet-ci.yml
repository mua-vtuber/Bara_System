name: 펫 Windows 검증
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # 비공개 저장소(보관용)에서는 돌리지 않는다. Windows 실행기는 비공개 저장소의 무료 사용 시간을 두 배로 쓴다.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/pet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.6
      # 펫 타입 검사·런타임 패키징 테스트가 ../memory 코드를 읽으므로 루트 작업공간 의존성도 설치한다.
      - name: 루트 작업공간 고정 의존성 설치
        working-directory: .
        run: bun install --frozen-lockfile
      - name: 고정 의존성 설치
        run: bun install --frozen-lockfile
      - name: 타입 검사
        run: bun run typecheck
      - name: 정책과 연결 테스트
        run: bun test src tests scripts/package-runtime.test.ts scripts/package-crt.test.ts
      - name: 화면 빌드
        run: bun run build:ui
      - name: Rust 실행 환경
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - name: 네이티브 Windows 실행 라이브러리
        run: bun run package:crt --native-only
      - name: Rust 형식 검사
        run: cargo +1.93.0 fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust 정적 검사
        run: cargo +1.93.0 clippy --locked --manifest-path src-tauri/Cargo.toml --tests -- -D warnings
      - name: 실제 Windows 보관소와 네이티브 테스트
        run: cargo +1.93.0 test --locked --manifest-path src-tauri/Cargo.toml
