# data/synonym_dictionary.yaml
# 한국어 동의어 사전 — BM25/FTS5 채널 한정 query expansion (임베딩 채널 합류 X / spec 13.3).
# 소비처: 검색 retriever fts 채널(공통 인프라 1.1b T2 / D9). 임베딩 채널 query 는
# 원본 그대로 — bge-m3 cosine 이 의미 매치를 자연 처리하므로 동의어 합류 시 중복 가중.
# 외부 fork·사용자 직접 갱신 통로 — DB 작업 없이 이 파일만 편집하면 즉시 반영.
#
# 형태 갈래: 명사형(포근함)과 형용사형(포근한)을 둘 다 둔다. query 토큰은
# 공백 분리 후 표면형 그대로 매칭하므로(형태소 분석 없음), "포근한 디자인" 같은
# 형용사 query 도 잡으려면 형용사 키가 필요하다.
synonyms:
  # ── 명사형 ──
  포근함: [따뜻함, 아늑함, 부드러움, 편안함, 몽글몽글함]
  날카로움: [선명함, 샤프함, 차가움, 세련됨]
  # ── 형용사형(검색 query 표면형 정합) ──
  포근한: [따뜻한, 아늑한, 부드러운, 편안한, 몽글몽글한]
  날카로운: [선명한, 샤프한, 차가운, 세련된]
  # ── 그 외 ──
  게임스럽다: [UI asset 같다, 모바일 게임풍, 캐주얼 게임풍]
  회의록: [미팅노트, 회의 정리, 미팅 메모]
  도구: [tool, 툴]
  컴퓨터: [PC, 데스크탑]
