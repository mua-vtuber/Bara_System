extractor_ko_default: |
  다음 글에서 atomic 단위 사실 / 결정 / 선호를 JSON 배열로 추출한다.
  각 항목은 한 문장으로 마침표 종결, 주어 명시, 접속사·수동태 회피.
extractor_en_default: |
  Extract atomic facts/decisions/preferences from the input as a JSON array.
  One sentence per item, explicit subject, no conjunctions or passive voice.
