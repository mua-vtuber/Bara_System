# ko.yaml — 한국어 언어 프로파일 (P3 G5-c)
#
# compute-intent / search-cues / short-text-gate / event-date 4개 모듈의
# 언어 의존 데이터(정규식 패턴·플래그·어휘 매핑)를 이 파일 한 장이 공급한다.
# 판정·파싱 로직은 각 모듈 TS 에 있고, 여기는 데이터만 담는다.
#
# 이 파일은 앱과 함께 배포되는 필수 파일이다 — 없거나 형식이 어긋나면 로더
# (profile-loader.ts)가 어느 칸인지 명시한 구체 에러로 부팅을 멈춘다
# (search-cues.yaml 류 "없으면 builtin 만" 자연 degrade 와 다르다).
#
# 정규식 표기(regex-l0 관례): 더블 백슬래시("\\s")로 적으면 parse 후 단일
# ("\s")로 환원돼 new RegExp 로 컴파일된다. 플래그가 필요한 패턴은
# { pattern: "...", flags: "g" } 매핑으로 적는다.
#
# 다른 언어 추가 = 같은 칸 구성으로 lang/<code>.yaml 한 장 작성(예: en.yaml)
# + profile-loader.ts 의 DEFAULT_LANGUAGE_CODE 전환.

version: 1
lang: ko

# ── compute-intent.ts — 집계 의도 감지 어휘 (plan D1) ────────────────────────
compute_intent:
  # 누적 로그 의도 — "진행상황 어디까지 됐지"·"현황". 가장 구체적 의도(우선순위 최상위).
  log_intent: "진행상황|진행\\s*상황|어디까지|현황"
  # 시간순 의도 — "언제"·"며칠" 같은 시점 질문 + "뭐 했"류.
  timeline_intent: "언제|며칠|뭐\\s*했|뭐\\s*한"
  # 개수 의도 — "몇 번"·"몇 개"·"횟수"·"개수".
  count_intent: "몇\\s*번|몇\\s*개|횟수|개수"
  # 목록 의도 — 가장 약한 신호(우선순위 최하위).
  list_intent: "목록|리스트|나열|뭐\\s*샀|뭐\\s*먹|뭐\\s*사|뭐\\s*구매"
  # 수치 합계 제외 신호 — 매치 시 즉시 null 컷(단계5 제외·Q1=C).
  numeric_intent: "얼마|합계|총액|총\\s*지출|총\\s*수입|몇\\s*원|총\\s*금액"

# ── search-cues.ts — 검색 cue builtin 어휘 (spec 5.3.1 / 5.3.2) ──────────────
search_cues:
  # 관계 cue — "왜 그 결정을 바꿨더라" 류(이전 결정 노드 + supersede 엣지).
  relation_cue: "왜|이유|의도|변경|결정|바꿨|바꾼|어떻게"
  # 주제 cue — 한 주제의 연결 자산 전부를 넓게 잡는 신호.
  topic_cue: "전체|모두|전부|모든"

# ── short-text-gate.ts — 짧은글 추출 스킵 판정 신호 (spec §4.2) ──────────────
short_text_gate:
  # 절 접속어미 — 있으면 절이 여럿이라 쪼갤 가치 있음(짧아도 스킵 안 함).
  # 어미는 어간 뒤에 붙으므로 토큰 경계 없이 부분 일치(한국어 교착 특성).
  clause_connectors:
    - "지만"                       # 대조: 좋아하지만
    # 인과 '-아서/-어서/-여서' — 어간 활용 음절(아/어/여/와/워/봐/줘/해/돼) + '서'.
    # 처격 조사 '-에서'(장소: '약국에서')·'-로서'를 인과로 오탐하지 않게 '서' 앞
    # 글자를 인과 활용 음절로 한정. 뒤 공백으로 명사 '순서'·'문서'도 차단.
    - "[아어여와워봐줘해돼]서\\s"
    - "으?며"                      # 나열: 먹으며 / 보며
    - "는데"                       # 배경: 가는데
  # '-고' 연결어미 — g 플래그로 문서 전체를 훑고, 매치 토큰이 인용 어미
  # (reported_speech_go)면 제외한다(판정 로직은 TS).
  go_connector: { pattern: "[가-힣]고\\s", flags: "g" }
  # 인용 '-다고/라고/냐고/자고' — '-고' 매치에서 제외할 토큰.
  reported_speech_go: "^(다고|라고|냐고|자고)$"
  # 문장 종결부호 — g 플래그로 개수를 센다.
  terminator_punctuation: { pattern: "[.?!]", flags: "g" }
  # 종결부호 없이 끝나는 한국어 종결 어말('-다'/'-음'/'-함'/'-까' 등) 보조 신호.
  sentence_final: "(다|음|함|까|네|군|지|죠|요)$"
  # 나열/복수 사실 신호 — 개행·나열 부호·접속 부사·병렬 조사.
  multi_fact_signals:
    - "\\n"
    - "[,，;；·•]"
    - "\\s(그리고|또|또한|및)\\s"
    - "[가-힣](랑|와|과|하고)\\s+[가-힣]"

# ── event-date.ts — 시간 표현 토큰 (옛 KO_TOKENS 테이블) ─────────────────────
event_date:
  # 굴러가는(열린) 창 표현 — 닫힌 날짜가 아니라 매치 시 null 컷.
  # "지난주"(닫힌 표현)와 안 섞이게 소비 모듈이 맨 앞에서 먼저 검사한다.
  rolling_window: "지난\\s*\\d+\\s*일|최근\\s*\\d+\\s*일|최근\\s*\\d+\\s*주|최근\\s*일주일|최근\\s*한\\s*주|지난\\s*\\d+\\s*개?월|최근\\s*\\d+\\s*개?월"
  # 절대 날짜 "YYYY년 M월 D일" / "M월 D일" / "M/D".
  abs_ymd: "(\\d{4})\\s*년\\s*(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일"
  # 연도 있는 숫자 날짜 "YYYY/M/D"·"YYYY.M.D"(캡처 1=년·2=월·3=일). 사이 공백 허용,
  # 빗금·점 혼용("2026/1.5")은 앞 부정 lookahead 로 막고, 앞뒤에 숫자가 붙으면 안 잡는다.
  # 버전 글자("v2024.10.3", "1.2026.1.5", "2026.1.5.3")를 날짜로 읽지 않게 앞에 영문자·점이 붙거나
  # 뒤에 ".숫자"가 이어지면 안 잡는다. 문장 끝 마침표("2026.1.5.")는 그대로 잡는다.
  # abs_md_slash 보다 먼저 검사해야 "2026/1/5" 가 "1/5"(연도 없음)로 잡히지 않는다.
  abs_ymd_numeric: "(?<![\\dA-Za-z.])(?!\\d{4}\\s*\\/\\s*\\d{1,2}\\s*\\.|\\d{4}\\s*\\.\\s*\\d{1,2}\\s*\\/)(\\d{4})\\s*[\\/.]\\s*(\\d{1,2})\\s*[\\/.]\\s*(\\d{1,2})(?!\\d|\\.\\d)"
  abs_md: "(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일"
  abs_md_slash: "(?<!\\d)(\\d{1,2})\\s*\\/\\s*(\\d{1,2})(?!\\d)"
  # 절대 달 "(YYYY년)? M월"(일 없음 — span 전용). "5월 25일"(일 포함)은
  # lookahead 로 제외해 점 매처가 가져가게 한다.
  abs_ym: "(?:(\\d{4})\\s*년\\s*)?(\\d{1,2})\\s*월(?!\\s*\\d{1,2}\\s*일)"
  # 상대 일 토큰 → now 자정 기준 일 오프셋.
  day_offsets:
    - { pattern: "그저께|그제", offset: -2 }
    - { pattern: "어제", offset: -1 }
    - { pattern: "오늘", offset: 0 }
    - { pattern: "내일", offset: 1 }
    - { pattern: "모레", offset: 2 }
  # "N일 전" / "N일 후·뒤". 캡처 그룹 1 = 숫자.
  days_ago: "(\\d+)\\s*일\\s*전"
  days_later: "(\\d+)\\s*일\\s*(?:후|뒤)"
  # 주 단위 토큰 → 주 오프셋(0=이번주, -1=지난주, +1=다음주).
  week_offsets:
    - { pattern: "지난\\s*주|저번\\s*주", offset: -1 }
    - { pattern: "이번\\s*주|금주", offset: 0 }
    - { pattern: "다음\\s*주|담주", offset: 1 }
  # 요일 글자 → getDay 값(0=일,1=월,...,6=토). weekday 패턴 캡처 2와 짝.
  weekday_getday:
    일: 0
    월: 1
    화: 2
    수: 3
    목: 4
    금: 5
    토: 6
  # 요일 표현 — 한정어(캡처 1·없을 수 있음) + "X요일"(캡처 2 = 요일 글자).
  # "요일" 글자를 반드시 포함시켜 "5월" 의 "월" 단독 오매칭을 막는다.
  weekday: "(지난\\s*주|저번\\s*주|이번\\s*주|금주|다음\\s*주|담주|지난|저번)?\\s*(월|화|수|목|금|토|일)요일"
  # 요일 한정어(공백 제거 후) → 주 오프셋. 여기 없는 한정어("지난"/"저번" —
  # 주 글자 없음)는 가장 최근 과거 그 요일로 떨어진다(판정 로직은 TS).
  weekday_qualifier_offsets:
    지난주: -1
    저번주: -1
    이번주: 0
    금주: 0
    다음주: 1
    담주: 1
  # 달 단위 토큰 → 달 오프셋.
  month_offsets:
    - { pattern: "지난\\s*달|저번\\s*달|지난\\s*개?월", offset: -1 }
    - { pattern: "이번\\s*달|금월|이번\\s*개?월", offset: 0 }
    - { pattern: "다음\\s*달|담달|내달", offset: 1 }
  # 달 토큰 *바로 뒤* 의 "N일"("다음 달 15일"). 소비 모듈이 달 토큰 매치 끝부터
  # 이 패턴을 맞춰 보므로 ^ 로 붙여 둔다. 캡처 1 = 일.
  month_day: "^\\s*(\\d{1,2})\\s*일"
  # 해 단위 토큰 → 매치 문자열별 해 오프셋. 옛 resolver 함수("매치가 재작년이면
  # -2, 아니면 -1")를 데이터로 편 것 — 패턴의 모든 대안 갈래가 offsets 에 있어야
  # 한다(빠지면 소비 모듈이 loud throw).
  year_offsets:
    - pattern: "작년|재작년"
      offsets: { 작년: -1, 재작년: -2 }
    - pattern: "올해|금년"
      offsets: { 올해: 0, 금년: 0 }
    - pattern: "내년"
      offsets: { 내년: 1 }
  # 시각 — "오전/오후 H시 (M분)"(캡처 1=오전·오후, 2=시, 3=분) / 콜론 "HH:MM".
  # 콜론 표기는 앞뒤 숫자 차단으로 날짜 슬래시·연속 숫자 오인을 막는다.
  hour_minute: "(오전|오후)?\\s*(\\d{1,2})\\s*시(?:\\s*(\\d{1,2})\\s*분)?"
  colon_time: "(?<!\\d)(\\d{1,2}):(\\d{2})(?!\\d)"
  # hour_minute 캡처 1과 비교할 오전/오후 어휘(12시간 → 24시간 보정 신호).
  meridiem_am: "오전"
  meridiem_pm: "오후"

# ── 항목·일정 자동 등록(2026-10-10 spec 4.2) — 호칭으로 볼 만한 이름 끝말 ─────────────
# 이 끝말이 붙은 새 이름은 "앞부분 + 호칭 / 전체가 이름 / 무시" 제안으로 한 번 묻는다.
# "이"는 받침 있는 이름 뒤에 붙는 말(몽룡이)이라 판정 코드가 앞 글자 받침을 확인한다.
# 하루가 분명한 상대 날짜 표현은 위 event_date.day_offsets 를 그대로 쓴다(목록 중복 금지).
entity_register:
  honorific_suffixes: ["형", "오빠", "누나", "언니", "씨", "님", "쌤", "선배", "이"]
  # 받침 있는 이름 뒤에만 붙는 끝말(위 목록의 부분집합).
  final_consonant_suffixes: ["이"]
