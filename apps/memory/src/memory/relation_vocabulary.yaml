# relation_vocabulary.yaml — 통합 cross-type 관계명 기본 씨앗 (분류 단계3 T7a · spec §7.2)
#
# 사용자 직접 편집 파일 — DB 작업 없이 이 파일만 고쳐도 기본 씨앗이 바뀐다
# (synonym_dictionary.yaml·concept_type_vocabulary.yaml 관례). 외부 fork 가 자기
# 관계 어휘로 키운다. 사용자가 화면으로 더하는 관계명은 별 테이블
# (relation_name_user_entries)에 쌓이고, 로더가 이 씨앗과 합집합으로 본다.
#
# 옛 entity-relation-vocabulary.ts 의 ENTITY_RELATION_NAMES 기본 씨앗 + RELATION_TAG_KEYS
# 한국어 키 매핑을 이 파일로 옮겼다. 코드 상수(SEED_RELATION_NAMES·SEED_RELATION_TAG_KEYS)
# 는 *이 씨앗 검증용*으로 남아, 동행 테스트가 yaml 씨앗 == 코드 상수를 대조한다
# (기본 씨앗 회귀 0 보장).
#
# 두 절:
#   relations    — 관계명 한 개의 명세. 관계명(영문 키) → source/target 허용 타입 +
#                  target 기본 타입. relation 키가 ENTITY_RELATION_NAMES 의 한 갈래다.
#   tag_keys     — 사용자가 #키:값 으로 적는 한국어 관계 태그 키 → 관계명. 한 관계명에
#                  여러 한국어 키가 붙을 수 있다(창작자·제작자·작가·만든사람 → created_by).
#
# 타입 이름(work·person·creature…)은 concept-type-vocabulary 의 PlacementTypeName
# (entity-type-registry 8 타입 + person·project)이라야 한다 — 미등록 타입은 병합이
# 식별자 담아 throw(silent fallback 금지).

relations:
  created_by:
    sourceTypes: [work]
    targetTypes: [person]
    defaultTargetType: person
  owned_by:
    sourceTypes: [creature]
    targetTypes: [person]
    defaultTargetType: person
  related_person:
    sourceTypes: [schedule, usable, intake]
    targetTypes: [person]
    defaultTargetType: person
  located_at:
    sourceTypes: [schedule]
    targetTypes: [place]
    defaultTargetType: place
  participated_by:
    sourceTypes: [project]
    targetTypes: [person]
    defaultTargetType: person
  family_of:
    sourceTypes: [person]
    targetTypes: [person]
    defaultTargetType: person
  friend_of:
    sourceTypes: [person]
    targetTypes: [person]
    defaultTargetType: person

# 한국어 태그 키 → 관계명. 한 관계명에 동의어 키 여럿이 붙는다(창작자=제작자=작가=만든사람).
# 키는 사용자가 #키:값 으로 적는 한국어 그대로. 로더가 소문자 정규화 후 조회한다.
tag_keys:
  창작자: created_by
  제작자: created_by
  작가: created_by
  만든사람: created_by
  주인: owned_by
  참여자: participated_by
  관련사람: related_person
  관련장소: located_at
  가족: family_of
  친구: friend_of
