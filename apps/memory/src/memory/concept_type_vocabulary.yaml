# concept_type_vocabulary.yaml — 개념 엔티티 타입 자동 배치 어휘 사전 (spec 2026-06-09 §6)
#
# 사용자 직접 편집 파일 — DB 작업 없이 이 파일만 고치면 즉시 반영(synonym_dictionary.yaml 관례).
# 외부 fork 가 자기 어휘로 키운다. 초기값은 "씨앗"이면 충분 — 매일 쓰며 직접 보강한다.
#
# 타입 키는 entity-type-registry 의 8 타입 + person·project. 레지스트리에 없는 타입 키는
# 로더가 구체 에러 throw(오타·미등록 타입을 silent 무시하지 않는다).
#
#   synonyms      — 이 타입을 가리키는 완전히 같은 뜻의 다른 말. 사용자가 #작업:X 라 적어도
#                   #프로젝트:X 와 같은 타입(project)으로 배치된다. 하위 개념은 여기 안 넣는다.
#   subcategories — 이 타입의 지붕 바로 아래 분류 레벨 단어(생물 아래 동물·식물 / 작품 아래
#                   소설·만화). 이 단어가 나오면 타입을 배치하고, 동시에 "타입 → 이 분류"
#                   parent_of 위계 진입 신호를 만든다(3단계가 생물→동물 엣지를 세운다).
#                   분류 레벨이라 1급 엔티티 행을 안 만든다 — concept_node 로만 산다.
#   attributes    — 이 타입이 가질 칸/라벨 키 어휘(spec §5 태그 키 단일 출처 — 3·4단계가 소비).
#                   subcategories 와 다름: attributes 는 속성을 거는 라벨 키(장르·유통기한),
#                   subcategories 는 위계 한 단을 내려가는 분류(소설·동물).
#
# 주의(로더 검증): 한 타입 안 synonyms 와 subcategories 가 같은 단어를 공유하면 구체 에러 —
# 타입 별칭과 하위 분류는 갈래가 달라 섞이면 위계 판정이 어긋난다.

types:
  project:
    synonyms: [작업, 작업물, 프로젝트, project, work-in-progress]
    subcategories: [코딩, 앱, 그림, live2d, 작곡, 글쓰기]
    attributes: [참여자]
  work:
    synonyms: [작품, 창작물, work, creation]
    subcategories: [소설, 만화, 게임, 애니, 영화, 음악, 웹툰]
    attributes: [장르, 창작자, 제작자, 작가, 만든사람]
  intake:
    synonyms: [섭취]
    subcategories: []
    attributes: [유통기한, 관련사람]
  usable:
    synonyms: [사용물]
    subcategories: [약, 화장품]
    attributes: [주의사항, 관련사람]
  creature:
    synonyms: [생물, creature]
    subcategories: [동물, 식물]
    attributes: [주인]
  thing:
    synonyms: [사물, 물건]
    subcategories: []
    attributes: []
  material:
    synonyms: [자료]
    subcategories: [문서, 논문, 회의록, 교재, 코드, 데이터]
    attributes: []
  place:
    synonyms: [장소, 공간]
    subcategories: []
    attributes: []
  schedule:
    synonyms: [일정, 약속, 기한]
    subcategories: []
    # 일정 날짜는 글 event_at 으로 모은다(spec 2026-06-28) — 전용 "날짜" 칸·라벨을 뺐다.
    # 관련사람·관련장소는 관계 키(relationTagKeySet)라 라벨로 안 새고 관계 wiring 이 처리한다.
    attributes: [관련사람, 관련장소]
  person:
    synonyms: [사람, 인물, 관계]
    subcategories: [가족, 친구]
    attributes: [직업, 회사]
